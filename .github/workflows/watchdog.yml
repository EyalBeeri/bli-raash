# Hourly: if the live page stopped updating, send a phone notification (see watchdog.py).
# Run it by hand with "test" to send a test notification.
name: watchdog
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the push library
        run: pip install -q pywebpush==2.5.0
      - name: Check the live page
        env:
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: python watchdog.py ${{ inputs.test && '--test' || '' }}
