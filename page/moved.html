<title>בלי רעש</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;700&family=IBM+Plex+Sans+Hebrew:wght@400;500&display=swap">
<style>
/* Layout: one centered card pointing to the feed's new home. */
:root { --bg: #E9EDF0; --surface: #FFFFFF; --ink: #12181D; --muted: #5E6B75; --line: #D3DADF; --accent: #19665D;
  --display: "Rubik", "Segoe UI", Arial, sans-serif; --body: "IBM Plex Sans Hebrew", "Segoe UI", Arial, sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0E1316; --surface: #172025; --ink: #EEF2F4; --muted: #95A3AC; --line: #26323A; --accent: #6CC6B8; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0E1316; --surface: #172025; --ink: #EEF2F4; --muted: #95A3AC; --line: #26323A; --accent: #6CC6B8; color-scheme: dark; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 18px; line-height: 1.7; }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 64px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px; display: flex; flex-direction: column; gap: 12px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 1.8rem; margin: 0; }
p { margin: 0; color: var(--muted); }
a.go { align-self: flex-start; background: var(--accent); color: var(--surface); text-decoration: none; font-weight: 500; padding: 10px 18px; border-radius: 8px; margin-top: 6px; }
a.go:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.url { font-size: 0.9rem; direction: ltr; text-align: right; user-select: all; }
</style>
<div class="wrap" dir="rtl" lang="he">
  <div class="card">
    <h1>בלי רעש עבר לכתובת חדשה</h1>
    <p>הפיד רץ עכשיו בענן ומתעדכן גם כשהמחשב כבוי. הכתובת החדשה פתוחה לכולם, אפשר לשתף אותה.</p>
    <a class="go" href="https://eyalbeeri.github.io/bli-raash/" target="_blank" rel="noopener">לפיד החדש</a>
    <p class="url">eyalbeeri.github.io/bli-raash</p>
  </div>
</div>
