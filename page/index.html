<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>בלי רעש</title>
<meta name="description" content="רק מה שחשוב לדעת: ידיעות מכמה כלי תקשורת, בלי דרמה ובלי רעש.">
<meta name="theme-color" content="#FCE9DC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F1720" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="בלי רעש">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: a calm reading column. Each day's stories sit on one warm sheet, separated by soft rules;
   the feed ends on purpose with the "settled line" mark. Mobile first, RTL throughout. */
:root {
  --apricot: #FCE9DC;   /* page */
  --sheet: #FFF8F3;     /* reading surface */
  --ink: #2A1F2D;       /* deep plum text */
  --ink-soft: #4E3F4C;
  --muted: #6B5A66;
  --rule: #F1DACD;
  --rose: #A8355C;      /* the few interactive bits */
  --rose-soft: #F9DCE3;
  --butter: #FBE7A1; --butter-ink: #5B4300;   /* changes what to do */
  --mint: #D3EEDD;   --mint-ink: #23553C;     /* changes the state of things */
  --lilac: #E6DEF7;  --lilac-ink: #45387A;    /* will matter for a while */
  --blush: #F8DCD2;  --blush-ink: #74372A;    /* topic */
  --alarm: #B4382A;  --alarm-ink: #FFFFFF;    /* an outlet that stopped responding */
  --display: "Fredoka", "Assistant", "Segoe UI", "Arial Hebrew", Arial, sans-serif;
  --body: "Assistant", "Segoe UI", "Arial Hebrew", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --apricot: #1F1720; --sheet: #2A2029; --ink: #F7ECE6; --ink-soft: #E3D3D9; --muted: #C2B0B8; --rule: #3B2E39;
    --rose: #F29AB8; --rose-soft: #47283A;
    --butter: #4A3B10; --butter-ink: #F7D978; --mint: #1F3A2C; --mint-ink: #A6E0BE;
    --lilac: #2F2847; --lilac-ink: #CFC2F5; --blush: #3D2722; --blush-ink: #F2C3B3;
    --alarm: #E46A55; --alarm-ink: #1F1720;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --apricot: #1F1720; --sheet: #2A2029; --ink: #F7ECE6; --ink-soft: #E3D3D9; --muted: #C2B0B8; --rule: #3B2E39;
  --rose: #F29AB8; --rose-soft: #47283A;
  --butter: #4A3B10; --butter-ink: #F7D978; --mint: #1F3A2C; --mint-ink: #A6E0BE;
  --lilac: #2F2847; --lilac-ink: #CFC2F5; --blush: #3D2722; --blush-ink: #F2C3B3;
  --alarm: #E46A55; --alarm-ink: #1F1720;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--apricot); color: var(--ink); font-family: var(--body); font-size: 18px; line-height: 1.75; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; border-radius: 6px; }
[hidden] { display: none !important; }

/* The mark reads in Hebrew's direction: noise on the right settling into a calm line on the left. */
.mark { width: 34px; height: 14px; flex: none; color: var(--rose); transform: scaleX(-1); }

/* Header: name, liveness, and the two views. Sticky but light. */
.top { position: sticky; top: 0; z-index: 5; background: var(--apricot); padding-top: env(safe-area-inset-top, 0px); }
.top-in { max-width: 680px; margin: 0 auto; padding-inline: 18px; padding-block: 12px 10px; display: flex; flex-direction: column; gap: 10px; }
.brand { display: flex; align-items: center; gap: 10px; }
.wordmark { font-family: var(--display); font-weight: 600; font-size: 1.55rem; line-height: 1; margin: 0; letter-spacing: -0.01em; }
.status { margin-inline-start: auto; display: inline-flex; align-items: center; gap: 7px; font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.status.live .dot { background: #3E9B6C; }
.status.stale { color: var(--alarm); }
.status.stale .dot { background: var(--alarm); }
.views { display: flex; gap: 4px; background: var(--sheet); border-radius: 999px; padding: 4px; align-self: flex-start; }
.view { border: 0; background: none; border-radius: 999px; padding: 6px 16px; font-weight: 600; font-size: 0.95rem; color: var(--muted); cursor: pointer; }
.view[aria-selected="true"] { background: var(--ink); color: var(--sheet); }
.view .n { font-weight: 400; margin-inline-start: 6px; font-variant-numeric: tabular-nums; opacity: 0.8; }

main { max-width: 680px; margin: 0 auto; padding-inline: 14px; padding-block: 8px 40px; }

/* The opening: a greeting and one calm sentence saying how much actually happened. */
.hello { padding-inline: 6px; padding-block: 18px 22px; }
.hello h2 { font-family: var(--display); font-weight: 500; font-size: 1.15rem; color: var(--muted); margin: 0; }
.hello p { font-family: var(--display); font-weight: 600; font-size: 1.6rem; line-height: 1.3; margin: 2px 0 0; text-wrap: balance; }

.day { font-family: var(--display); font-weight: 600; font-size: 1.05rem; color: var(--ink-soft); margin: 26px 8px 10px; }
.day:first-of-type { margin-top: 0; }
.sheet { background: var(--sheet); border-radius: 22px; padding-inline: 20px; }

.story { padding-block: 20px; display: flex; flex-direction: column; gap: 8px; }
.story + .story { border-top: 1px solid var(--rule); }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.time { font-weight: 700; font-size: 0.9rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; margin-inline-end: 4px; }
/* The topic is plain text, not a pill: filled pills are kept for the few things that are true of one story only. */
.topic { font-size: 0.88rem; font-weight: 600; color: var(--muted); margin-inline-end: 4px; }
.topic::before { content: "·"; margin-inline-end: 8px; }
.pill { font-size: 0.8rem; font-weight: 600; line-height: 1.4; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.pill.edited { background: var(--butter); color: var(--butter-ink); }
.story h3 { font-family: var(--display); font-weight: 600; font-size: 1.32rem; line-height: 1.38; margin: 2px 0 0; text-wrap: balance; }
.story p { margin: 0; }
.byline { font-size: 0.88rem; color: var(--muted); }
.byline a { color: var(--ink-soft); text-underline-offset: 3px; text-decoration-color: var(--rule); }
.byline a:hover { text-decoration-color: currentColor; }
.byline .upd { display: block; }


/* The ending: the feed is finite on purpose. */
.end { text-align: center; padding-block: 44px 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.end .mark { width: 96px; height: 36px; margin-bottom: 6px; }
.end strong { font-family: var(--display); font-weight: 600; font-size: 1.35rem; }
.end p { margin: 0; color: var(--muted); max-width: 32ch; }
.link-btn { border: 0; background: none; color: var(--rose); font-weight: 600; text-decoration: underline; text-underline-offset: 4px; cursor: pointer; padding: 6px; }

.empty { background: var(--sheet); border-radius: 22px; padding: 30px 22px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-family: var(--display); font-weight: 600; font-size: 1.2rem; margin-bottom: 4px; }

/* What was filtered out, and why. */
.cuts-intro { padding: 18px 6px 14px; color: var(--ink-soft); margin: 0; }
.cats { display: flex; flex-wrap: wrap; gap: 6px; padding-inline: 2px; margin-bottom: 14px; }
.cat { border: 0; border-radius: 999px; padding: 5px 12px; font-size: 0.85rem; font-weight: 600; cursor: pointer; background: var(--sheet); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.cat.waiting { background: var(--lilac); color: var(--lilac-ink); }
.cat[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
.cut { padding-block: 14px; display: flex; flex-direction: column; gap: 2px; }
.cut + .cut { border-top: 1px solid var(--rule); }
.cut a, .cut .t { text-decoration: none; font-size: 1rem; line-height: 1.5; }
.cut a:hover { text-decoration: underline; }
.cut .why { font-size: 0.82rem; color: var(--muted); }
.cut .why b { font-weight: 600; color: var(--ink-soft); }

footer { max-width: 680px; margin: 0 auto; padding-inline: 20px; padding-block: 8px calc(36px + env(safe-area-inset-bottom, 0px)); color: var(--muted); font-size: 0.85rem; display: flex; flex-direction: column; gap: 10px; }
.outlets { display: flex; flex-wrap: wrap; gap: 4px 14px; font-variant-numeric: tabular-nums; }
.outlets .bad { color: var(--alarm); }
.install { background: var(--sheet); border-radius: 16px; padding: 12px 14px; color: var(--ink-soft); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.install button { border: 0; background: var(--ink); color: var(--sheet); border-radius: 999px; padding: 6px 14px; font-weight: 600; cursor: pointer; }

@media (min-width: 720px) {
  body { font-size: 19px; }
  .hello p { font-size: 1.85rem; }
  .story h3 { font-size: 1.42rem; }
  .sheet { padding-inline: 28px; }
}
.pill.new { background: var(--rose); color: var(--sheet); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="settle" viewBox="0 0 96 36"><path d="M2 18 C8 4, 14 4, 18 18 S28 32, 32 18 S40 8, 44 18 S50 26, 54 18 S62 18, 66 18 L94 18" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg class="mark" aria-hidden="true"><use href="#settle"/></svg>
      <h1 class="wordmark">בלי רעש</h1>
      <span class="status" id="status"><span class="dot"></span><span id="status-text">מתחבר…</span></span>
    </div>
    <div class="views" role="tablist" aria-label="תצוגה">
      <button class="view" role="tab" id="tab-news" aria-selected="true" aria-controls="view" tabindex="0">חדשות<span class="n" id="n-news"></span></button>
      <button class="view" role="tab" id="tab-cuts" aria-selected="false" aria-controls="view" tabindex="-1">מה סוננו<span class="n" id="n-cuts"></span></button>
    </div>
  </div>
</header>
<main>
  <div id="view" role="tabpanel" aria-labelledby="tab-news">
    <div class="empty"><strong>טוען את הידיעות</strong>רגע אחד.</div>
  </div>
</main>
<footer id="foot"></footer>

<script>
const WAITING = "ממתין למקור נוסף";
const TZ = "Asia/Jerusalem";
const hmFmt = new Intl.DateTimeFormat("he-IL", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false });
const dayKeyFmt = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });
const dayNameFmt = new Intl.DateTimeFormat("he-IL", { timeZone: TZ, weekday: "long", day: "numeric", month: "long" });
const hourFmt = new Intl.DateTimeFormat("en-GB", { timeZone: TZ, hour: "numeric", hour12: false });
const weekdayFmt = new Intl.DateTimeFormat("he-IL", { timeZone: TZ, weekday: "long" });

const state = { feed: null, filtered: null, tab: "news", cat: null, failed: false, sig: "", prevSeen: null,
                installEvent: null, installed: false, pendingReload: false };
try { const t = localStorage.getItem("bli-tab"); if (t === "news" || t === "cuts") state.tab = t; } catch (e) {}
// Stories that arrived since the reader's previous visit carry a "חדש" pill for this whole visit.
try { state.prevSeen = localStorage.getItem("bli-last-seen"); } catch (e) {}
const markSeen = () => { try { localStorage.setItem("bli-last-seen", new Date().toISOString()); } catch (e) {} };

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isHttp = u => /^https?:\/\//.test(u || "");
const fmt = (f, iso) => { try { return f.format(new Date(iso)); } catch (e) { return ""; } };
const ms = iso => new Date(iso).getTime();
const dayKey = iso => fmt(dayKeyFmt, iso);
const hm = iso => fmt(hmFmt, iso);

function ago(iso) {
  const m = Math.round((Date.now() - ms(iso)) / 60000);
  if (!Number.isFinite(m)) return "";
  if (m < 1) return "עכשיו";
  if (m < 60) return `לפני ${m} דק׳`;
  const h = Math.floor(m / 60);
  return h === 1 ? "לפני שעה" : h === 2 ? "לפני שעתיים" : `לפני ${h} שעות`;
}
// Calendar arithmetic on the Israeli date itself, so "yesterday" survives the daylight-saving change.
function shiftKey(key, days) {
  const [y, m, d] = key.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d + days)).toISOString().slice(0, 10);
}
function dayLabel(iso) {
  const k = dayKey(iso), today = dayKey(new Date().toISOString());
  if (k === today) return "היום";
  if (today && k === shiftKey(today, -1)) return "אתמול";
  return fmt(dayNameFmt, iso);
}
// A time together with its day ("היום ב-19:14", "אתמול ב-18:43", "ביום שלישי ב-18:43"), for anything that can cross midnight.
function when(iso) {
  const k = dayKey(iso), today = dayKey(new Date().toISOString());
  const day = k === today ? "היום" : today && k === shiftKey(today, -1) ? "אתמול" : "ביום " + fmt(weekdayFmt, iso).replace(/^יום /, "");
  return `${day} ב-${hm(iso)}`;
}
function greeting() {
  const h = Number(hourFmt.format(new Date()));
  return h >= 5 && h < 12 ? "בוקר טוב" : h >= 12 && h < 17 ? "צהריים טובים" : h >= 17 && h < 22 ? "ערב טוב" : "לילה טוב";
}
function countLine(n) {
  if (n === 0) return "ב-24 השעות האחרונות לא קרה משהו שחשוב לדעת.";
  if (n === 1) return "דבר אחד חשוב קרה ב-24 השעות האחרונות.";
  return `${n} דברים חשובים קרו ב-24 השעות האחרונות.`;
}
// One entry per outlet, with a link when one of its reports has a real address (some feeds omit it).
const outletList = s => {
  const seen = new Map();
  for (const x of s.sources || []) {
    const url = isHttp(x.url) ? x.url : "";
    if (!seen.has(x.name) || (url && !seen.get(x.name))) seen.set(x.name, url);
  }
  return [...seen];
};

// When the story was first reported and when it was confirmed. Day words appear only when the days differ,
// and a short gap isn't worth a line.
function storyNote(s) {
  const sameDay = dayKey(s.created) === dayKey(s.updated);
  const first = sameDay ? `ב-${hm(s.created)}` : when(s.created);
  if (s.updates > 0) return `פורסם לראשונה ${first}`;
  if (ms(s.updated) - ms(s.created) < 30 * 60000) return "";
  return `דווח לראשונה ${first}, אושר ${sameDay ? `ב-${hm(s.updated)}` : when(s.updated)}`;
}

function storyHtml(s) {
  const pills = [];
  if (state.prevSeen && ms(s.updated) > ms(state.prevSeen)) pills.push(`<span class="pill new">חדש</span>`);
  if (s.updates > 0) pills.push(`<span class="pill edited">עודכן</span>`);
  const links = outletList(s).map(([name, url]) => url
    ? `<a href="${esc(url)}" target="_blank" rel="noopener"><bdi>${esc(name)}</bdi></a>` : `<bdi>${esc(name)}</bdi>`).join(", ");
  const note = storyNote(s);
  return `<article class="story" data-id="${esc(s.id)}">
    <div class="meta"><span class="time">${hm(s.updated)}</span><span class="topic">${esc(s.topic)}</span>${pills.join("")}</div>
    <h3>${esc(s.headline)}</h3>
    <p>${esc(s.summary)}</p>
    <div class="byline">דיווחו: ${links}${note ? `<span class="upd">${note}</span>` : ""}</div>
  </article>`;
}

function endLine() {
  const items = state.filtered?.items || [];
  const waiting = items.filter(i => i.category === WAITING).length, cut = items.length - waiting;
  const n = x => x.toLocaleString("he-IL");
  if (cut && waiting) return `${n(cut)} ידיעות אחרות לא עברו את המבחן, ו-${n(waiting)} מחכות שמקור נוסף יאשר אותן.`;
  if (cut) return `${n(cut)} ידיעות אחרות לא עברו את המבחן.`;
  if (waiting) return `${n(waiting)} ידיעות מחכות שמקור נוסף יאשר אותן.`;
  return "כל השאר לא עבר את המבחן.";
}

function renderNews() {
  const stories = [...(state.feed?.stories || [])].sort((a, b) => String(b.updated).localeCompare(String(a.updated)));
  const dayAgo = Date.now() - 864e5;
  let out = `<section class="hello"><h2>${greeting()}.</h2><p>${countLine(stories.filter(s => ms(s.updated) >= dayAgo).length)}</p></section>`;
  if (!stories.length) {
    return out + `<div class="empty"><strong>${state.failed ? "אין חיבור כרגע" : "עוד אין ידיעות"}</strong>${state.failed ? "כשיחזור החיבור הדף יתעדכן לבד." : "ידיעות שדווחו בשני כלי תקשורת לפחות יופיעו כאן."}</div>`;
  }
  const byDay = new Map();
  for (const s of stories) { const d = dayLabel(s.updated); if (!byDay.has(d)) byDay.set(d, []); byDay.get(d).push(s); }
  for (const [d, list] of byDay) out += `<h2 class="day">${esc(d)}</h2><div class="sheet">${list.map(storyHtml).join("")}</div>`;
  out += `<section class="end">
    <svg class="mark" aria-hidden="true"><use href="#settle"/></svg>
    <strong>זהו, ראית את כל מה שחשוב.</strong>
    <p>${endLine()}</p>
    <button class="link-btn" data-goto="cuts">מה סוננו ולמה</button>
  </section>`;
  return out;
}

function renderCuts() {
  const items = [...(state.filtered?.items || [])].sort((a, b) => String(b.t).localeCompare(String(a.t)));
  if (!items.length) return `<p class="cuts-intro">עוד לא סונן כלום.</p>`;
  const counts = new Map();
  for (const it of items) counts.set(it.category, (counts.get(it.category) || 0) + 1);
  const cats = [...counts].sort((a, b) => (a[0] === WAITING ? -1 : b[0] === WAITING ? 1 : b[1] - a[1]));
  const shown = state.cat ? items.filter(i => i.category === state.cat) : items;
  return `<p class="cuts-intro">כל מה שנחתך ביממה האחרונה, ולמה. ידיעה שדווחה רק בכלי תקשורת אחד מחכה כאן עד שמקור נוסף מאשר אותה.</p>
    <div class="cats">${cats.map(([c, n]) => `<button class="cat${c === WAITING ? " waiting" : ""}" data-cat="${esc(c)}" aria-pressed="${state.cat === c}">${esc(c)} (${n})</button>`).join("")}</div>
    <div class="sheet">${shown.map(it => `<div class="cut">
      ${isHttp(it.url) ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>` : `<span class="t">${esc(it.title)}</span>`}
      <span class="why"><bdi>${when(it.t)}</bdi>&rlm;, <bdi>${esc(it.source)}</bdi>&rlm;. <b>${esc(it.category)}</b>${it.reason ? `: <bdi>${esc(it.reason)}</bdi>` : ""}</span>
    </div>`).join("")}</div>`;
}

function renderStatus() {
  const el = document.getElementById("status"), txt = document.getElementById("status-text");
  if (!state.feed?.updated) { el.className = "status"; txt.textContent = state.failed ? "אין חיבור" : "מתחבר…"; return; }
  const stale = (Date.now() - ms(state.feed.updated)) / 60000 > 45;
  el.className = "status " + (stale ? "stale" : "live");
  txt.textContent = (stale ? "לא התעדכן " : "נבדק ") + ago(state.feed.updated);
}

const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const onPhone = matchMedia("(pointer: coarse)").matches;

function renderFoot() {
  const h = state.feed?.health || [];
  const standalone = state.installed || matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  let html = "";
  if (h.length) {
    html += `<div>הידיעות נאספות מ-${h.length} כלי תקשורת ונבדקות כל כמה דקות. ידיעה מופיעה רק כשלפחות שניים מהם דיווחו עליה.</div>
      <div class="outlets">${h.map(x => `<span class="${x.ok ? "" : "bad"}" title="${esc(x.error || "")}"><bdi>${esc(x.source)}</bdi>${x.ok ? (x.newest ? ", " + ago(x.newest) : "") : ", תקלה"}</span>`).join("")}</div>`;
  }
  if (!standalone) {
    if (state.installEvent) html += `<div class="install">אפשר להתקין את בלי רעש כאפליקציה. <button id="install">התקנה</button></div>`;
    else if (isIOS) html += `<div class="install">להתקנה כאפליקציה: בספארי לוחצים על כפתור השיתוף ובוחרים "הוספה למסך הבית".</div>`;
    else if (onPhone) html += `<div class="install">להתקנה כאפליקציה: בתפריט הדפדפן בוחרים "הוספה למסך הבית".</div>`;
  }
  document.getElementById("foot").innerHTML = html;
}

// Rebuild the view, keeping the reader's place when stories are added above what they're reading.
function render({ keepPlace = false } = {}) {
  const nNews = state.feed?.stories?.length || 0, nCuts = state.filtered?.items?.length || 0;
  document.getElementById("n-news").textContent = nNews ? nNews : "";
  document.getElementById("n-cuts").textContent = nCuts ? nCuts.toLocaleString("he-IL") : "";
  for (const t of ["news", "cuts"]) {
    const b = document.getElementById("tab-" + t);
    b.setAttribute("aria-selected", String(state.tab === t));
    b.tabIndex = state.tab === t ? 0 : -1;
  }
  const view = document.getElementById("view");
  view.setAttribute("aria-labelledby", "tab-" + state.tab);
  let anchor = null;
  if (keepPlace && state.tab === "news" && window.scrollY > 0) {
    const headerBottom = document.querySelector(".top").getBoundingClientRect().bottom;
    for (const a of view.querySelectorAll(".story")) {
      const r = a.getBoundingClientRect();
      if (r.bottom > headerBottom) { anchor = { id: a.dataset.id, top: r.top }; break; }
    }
  }
  view.innerHTML = state.tab === "news" ? renderNews() : renderCuts();
  if (anchor) {
    const el = [...view.querySelectorAll(".story")].find(a => a.dataset.id === anchor.id);
    if (el) window.scrollBy(0, el.getBoundingClientRect().top - anchor.top);
  }
  renderStatus();
  renderFoot();
}

function setTab(t, focus) {
  state.tab = t;
  try { localStorage.setItem("bli-tab", t); } catch (e) {}
  render();
  window.scrollTo(0, 0);
  if (focus) document.getElementById("tab-" + t).focus();
}

document.addEventListener("click", e => {
  const tab = e.target.closest(".view");
  if (tab) { setTab(tab.id === "tab-cuts" ? "cuts" : "news"); return; }
  const go = e.target.closest("[data-goto]");
  if (go) { setTab(go.dataset.goto, true); return; }
  const cat = e.target.closest(".cat");
  if (cat) {
    const c = cat.dataset.cat;
    state.cat = state.cat === c ? null : c;
    render();
    [...document.querySelectorAll(".cat")].find(b => b.dataset.cat === c)?.focus();
    return;
  }
  if (e.target.closest("#install") && state.installEvent) {
    state.installEvent.prompt();
    state.installEvent.userChoice.finally(() => { state.installEvent = null; renderFoot(); });
  }
});
document.querySelector(".views").addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "Home" || e.key === "End") {
    e.preventDefault();
    setTab(state.tab === "news" ? "cuts" : "news", true);
  }
});

async function pull(name) {
  // Revalidate with the server each time; unchanged files come back as a cheap "not modified".
  const r = await fetch(name, { cache: "no-cache" });
  if (!r.ok) throw new Error(String(r.status));
  return r.json();
}

const signature = () => [state.failed, (state.feed?.stories || []).map(s => s.id + s.updated).join(","),
  (state.filtered?.items || []).length, state.filtered?.items?.[0]?.id].join("|");

async function refresh(force) {
  if (document.hidden && !force) return;
  try { state.feed = await pull("feed.json"); state.failed = false; } catch (e) { if (!state.feed) state.failed = true; }
  try { state.filtered = await pull("filtered.json"); } catch (e) {}
  const sig = signature();
  if (sig !== state.sig) { const first = !state.sig; state.sig = sig; render({ keepPlace: !first }); }
  else { renderStatus(); renderFoot(); }
}

// The installed app picks up a new version of itself, but never reloads while someone is reading.
let swReg = null;
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").then(r => { swReg = r; }).catch(() => {});
  let hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController) { hadController = true; return; }
    if (document.hidden) location.reload(); else state.pendingReload = true;
  });
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { markSeen(); if (state.pendingReload) location.reload(); return; }
  refresh(true);
  swReg?.update().catch(() => {});
});
window.addEventListener("pagehide", markSeen);
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); state.installEvent = e; renderFoot(); });
window.addEventListener("appinstalled", () => { state.installed = true; state.installEvent = null; renderFoot(); });

render();
refresh(true);
setInterval(refresh, 60000);
setInterval(renderStatus, 30000);
</script>
</body>
</html>
